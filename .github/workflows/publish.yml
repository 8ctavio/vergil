name: Publish Package

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
      - name: Generate declaration files
        run: pnpm --filter vergil dts
      - name: Run tests
        run: pnpm --filter vergil test:prod
      - name: Publish
        run: pnpm --filter vergil publish --no-git-checks --access public
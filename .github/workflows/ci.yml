name: ci

on:
  pull_request:
    branches: [main]
    paths: ['packages/vergil/**']
  push:
    branches: [main]
    paths: ['packages/vergil/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm ci
      - name: Lint
        run: pnpm lint
      - name: Generate declaration files
        run: pnpm --filter vergil dts
      - name: Run tests
        run: pnpm --filter vergil test:prod
name: ci

on:
  pull_request:
    branches: [main]
    paths: ['packages/vergil/**']
  push:
    branches: [main]
    paths: ['packages/vergil/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24
      - name: Lint
        run: pnpm lint
      - name: Generate declaration files
        run: pnpm --filter vergil dts
      - name: Run tests
        run: pnpm --filter vergil test:prod